# /etc/nginx/sites-available/dartler
#
#   sudo ln -s /etc/nginx/sites-available/dartler /etc/nginx/sites-enabled/dartler
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER this is in place and DNS has propagated; it rewrites this
# file in place to add the 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name dartler.in www.dartler.in;   # <-- your domain, both forms

    # Certbot's ACME challenge needs to reach the filesystem, not the app.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Product photographs and the admin's uploads. Capped at 5 MB in the app,
    # so anything larger is rejected here before it reaches node.
    client_max_body_size 10M;

    # Next fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Generated artwork and uploaded photographs.
    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_cache_bypass $http_upgrade;

        # A Razorpay webhook or a Delhivery push must not be cut off mid-flight.
        proxy_read_timeout    120s;
        proxy_connect_timeout 30s;
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
}
